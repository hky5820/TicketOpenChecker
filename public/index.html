<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>티켓 오픈 · 일정</title>
  <meta name="theme-color" content="#f4f6fa">
  <meta name="color-scheme" content="light">
  <meta name="description" content="날짜와 예매처로 찾는 티켓 오픈 일정. KBO 5개 구단의 경기와 예매 오픈도 한눈에.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="티켓오픈">
  <link rel="stylesheet" href="home.css?v=20260928-browse">
  <script defer src="schedule-model.js?v=20260928"></script>
  <script defer src="home.js?v=20260928-browse"></script>
</head>
<body>
  <a class="skip" href="#results">일정 목록으로 이동</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="티켓 오픈 홈"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4z"/><path d="M9 5v3m0 3v2m0 3v3"/></svg></span><span>티켓<span class="brand-light">오픈</span></span></a>
      <nav class="main-nav" aria-label="주 메뉴">
        <button id="tab-home" data-view="home" aria-current="page">공연·전시</button>
        <button id="tab-sports" data-view="sports">스포츠 <span class="nav-note">KBO</span></button>
        <button id="tab-alarm" data-view="alarm">내 알림 <span id="alarmCount" class="nav-count" hidden></span></button>
      </nav>
      <button id="settingsBtn" class="icon-button" type="button" aria-label="데이터 및 알림 설정" title="데이터 및 알림 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="16" cy="17" r="3" fill="currentColor"/></svg></button>
    </header>
    <main>
      <div class="page-heading">
        <div><p class="eyebrow" id="eyebrow">TICKET OPENING</p><h1 id="pageTitle">티켓 오픈 일정</h1><p id="pageDescription">원하는 날짜, 원하는 예매처의 오픈을 한눈에.</p></div>
        <div class="heading-actions"><span id="updatedAt" class="updated"></span><button class="button primary" id="reloadBtn" type="button" aria-label="일정 새로고침" title="일정 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg><span>새로고침</span></button></div>
      </div>
      <div id="loadStatus" class="load-status" role="status" hidden></div>
      <div class="workspace" id="scheduleWorkspace">
        <aside class="sidebar" aria-label="일정 필터">
          <section class="calendar-panel" aria-label="날짜 선택">
            <div class="calendar-heading"><h2 id="calendarMonth"></h2><div><button class="icon-button" id="monthPrev" aria-label="이전 달">‹</button><button class="icon-button" id="monthNext" aria-label="다음 달">›</button></div></div>
            <div class="calendar-week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
            <div id="calendarGrid" class="calendar-grid"></div>
            <div class="calendar-footer"><span><i></i>일정 있는 날</span><button id="todayBtn" class="text-button">오늘로 이동</button></div>
          </section>
          <section class="source-panel"><h2 id="sourceTitle">예매처</h2><div id="sourceFilters" class="source-filters"></div></section>
          <div class="sidebar-note" id="sourceNote"></div>
        </aside>
        <section class="schedule-panel" aria-label="티켓 일정">
          <div class="filter-head">
            <div class="concert-date-nav" aria-label="오픈 날짜 이동"><button class="icon-button" data-day-step="-1" aria-label="이전 날">‹</button><button id="datePickerBtn" aria-haspopup="dialog" aria-controls="dateDialog"><span id="datePickerLabel"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg></button><button class="icon-button" data-day-step="1" aria-label="다음 날">›</button><button class="date-today" id="quickTodayBtn">오늘</button></div>
            <div class="date-toolbar"><div class="date-select"><label for="selectedDate" id="dateLabel">오픈일</label><input type="date" id="selectedDate" aria-label="조회 날짜"></div><div class="segmented" id="rangeFilters" aria-label="조회 기간"><button data-range="day" aria-pressed="true">하루</button><button data-range="week" aria-pressed="false">7일</button><button data-range="upcoming" aria-pressed="false">전체 예정</button></div></div>
            <label class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="공연명 검색" aria-label="일정 검색" autocomplete="off"></label>
          </div>
          <div id="sportsControls" class="sports-controls" hidden><div class="basis-controls" aria-label="날짜 기준"><button data-basis="game" aria-pressed="true">경기일 기준</button><button data-basis="open" aria-pressed="false">티켓 오픈일 기준</button></div><span>티켓링크 · 홈경기</span></div>
          <div class="results-heading"><div><h2 id="resultTitle"></h2><span id="resultCount" class="result-count" aria-live="polite" aria-atomic="true"></span></div><button class="text-button" id="resetFilters">필터 초기화</button></div>
          <div class="status-filters" id="statusFilters" aria-label="예매 상태"></div>
          <div id="dataNotice" class="data-notice" hidden></div>
          <div id="results" class="results" tabindex="-1"><div class="empty-state"><h3>일정을 불러오는 중</h3></div></div>
          <footer class="list-footer"><span id="listHint">모든 시각은 한국 표준시(KST) 기준</span><span id="listTotal"></span></footer>
        </section>
      </div>
      <section id="alarmWorkspace" class="alarm-workspace" hidden><div id="alarmHint" class="alarm-hint"></div><div id="alarmBody"></div></section>
    </main>
    <footer class="app-footer"><span>날짜를 고르면, 오픈이 보입니다.</span><a href="calendar.ics" download>공연 오픈 캘린더 내려받기 ↗</a></footer>
  </div>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="dialog-heading"><h2 id="settingsTitle">데이터 및 알림</h2><button class="icon-button" data-close="settingsDialog" aria-label="설정 닫기">×</button></div><div id="settingsBody"></div></dialog>
  <dialog id="dateDialog" class="date-dialog" aria-labelledby="dateDialogTitle"><div class="dialog-heading"><h2 id="dateDialogTitle">오픈 날짜 선택</h2><button class="icon-button" data-close="dateDialog" aria-label="날짜 선택 닫기">×</button></div><div id="dateDialogBody"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
